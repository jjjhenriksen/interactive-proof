name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate, build, and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
      NPM_CONFIG_FUND: false
      PLAYWRIGHT_SERVER: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Lean for compiler regression fixtures
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat proofs/odd-sum-square/lean-toolchain)"

      - name: Validate proof packages
        run: npm run proof:validate

      - name: Verify authored Lean package
        run: npm run proof:verify

      - name: Validate evaluation set
        run: npm run eval:validate

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run development fixture browser smoke tests
        env:
          PLAYWRIGHT_SERVER: development
        run: npm run test:e2e:smoke

      - name: Run production upload-first browser smoke tests
        run: npx playwright test tests/e2e/reader-smoke.spec.ts tests/e2e/methodology.spec.ts --project=chromium --grep 'opens the upload workspace|publishes the fixed methodology|returns an upload-first 404'

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
